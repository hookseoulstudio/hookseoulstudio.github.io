<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hookseoul Studio 앱 정보와 개인정보처리방침">
  <title>Hookseoul Studio · 앱 정보</title>
  <style>
    :root { color-scheme: dark; --bg: #181a1b; --panel: #242728; --text: #f4f1e8; --muted: #bcbdb7; --accent: #e4ca83; --line: #414443; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.65; }
    main { max-width: 800px; margin: 0 auto; padding: clamp(48px, 10vw, 100px) 22px 72px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); line-height: 1.15; letter-spacing: -.04em; }
    .lead { margin: 18px 0 36px; color: var(--muted); font-size: 17px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .card { display: block; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: inherit; text-decoration: none; transition: border-color .2s, transform .2s; }
    .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
    .card h2 { margin: 0 0 8px; font-size: 22px; }
    .card p { margin: 0; color: var(--muted); }
    .card span { display: inline-block; margin-top: 20px; color: var(--accent); font-weight: 700; }
    footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hookseoul Studio</p>
    <h1>작은 선택을 더 즐겁게.</h1>
    <p class="lead">Hookseoul Studio의 앱과 개인정보처리방침을 확인할 수 있습니다.</p>
    <div class="grid">
      <a class="card" href="/eodige-privacy-policy.html">
        <h2>어디게</h2>
        <p>국기와 지도로 나라를 알아가는 퀴즈 게임</p>
        <span>개인정보처리방침 보기 →</span>
      </a>
      <a class="card" href="/privacy-policy.html">
        <h2>뭐먹?</h2>
        <p>오늘 먹을 음식을 고르는 앱</p>
        <span>개인정보처리방침 보기 →</span>
      </a>
    </div>
    <footer>문의: <a href="mailto:hookseoul109@gmail.com">hookseoul109@gmail.com</a></footer>
  </main>
</body>
</html>
